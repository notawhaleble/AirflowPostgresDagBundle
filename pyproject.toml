[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airflow-postgres-dag-bundle"
version = "0.1.0"
description = "Airflow 3 DAG bundle backend backed by the Airflow metadata PostgreSQL database."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "apache-airflow-core>=3.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/airflow_postgres_dag_bundle"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
